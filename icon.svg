  <g fill="none" stroke="#EEF2FF" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 16.5 V47.5"/>
    <path d="M22 16.5 H31 Q38 16.5 38 24 Q38 31.5 31 31.5 H22"/>
    <path d="M22 31.5 H33 Q42 31.5 42 39.5 Q42 47.5 33 47.5 H22"/>
  </g>
