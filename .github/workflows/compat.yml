name: BaseMind compatibility

# Downloads one pinned BaseMind build per OS and runs the real integration suites
# against it. This is the only macOS/Linux evidence the project can collect: the
# suites skip without a binary, so this workflow always sets
# BASEMIND_REQUIRE_INTEGRATION=1 and fails when the download or the run does not
# happen.
#
# `basemind_version` lets a maintainer point the version-agnostic suite at an older
# build (for example 0.33.0). The verb-tool contract suite runs whenever the tested
# build is the pinned one: the Resolve step exports the pin from lib/upstream.js as
# BM_PIN and the gate compares against it, so a pin bump keeps the contract suite
# running while an explicitly chosen older input still skips it (those builds do not
# advertise the verb tools).

on:
  workflow_dispatch:
    inputs:
      basemind_version:
        description: BaseMind release to test (empty = the version pinned in lib/upstream.js)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  compat:
    name: ${{ matrix.os }} / BaseMind pin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: basemind-x86_64-unknown-linux-gnu.tar.gz
            binary: basemind
            arch: x86_64
          # macOS runners are arm64, and the aarch64 asset is the only macOS build
          # BaseMind publishes.
          - os: macos-15
            asset: basemind-aarch64-apple-darwin.tar.gz
            binary: basemind
            arch: arm64
          - os: windows-latest
            asset: basemind-x86_64-pc-windows-msvc.zip
            binary: basemind.exe
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0

      - name: Resolve the pinned BaseMind version
        shell: bash
        run: |
          pin="$(node -e "import('./lib/upstream.js').then(m => console.log(m.UPSTREAM.version))")"
          version='${{ inputs.basemind_version }}'
          if [ -z "$version" ]; then
            version="$pin"
          fi
          echo "BM_PIN=$pin" >> "$GITHUB_ENV"
          echo "BM_VERSION=$version" >> "$GITHUB_ENV"
          echo "testing BaseMind $version (pin $pin)"

      - name: Install BaseMind ${{ inputs.basemind_version || 'pinned' }}
        shell: bash
        run: |
          version="$BM_VERSION"
          asset='${{ matrix.asset }}'
          base="https://github.com/Goldziher/basemind/releases/download/v${version}"
          mkdir -p "$RUNNER_TEMP/basemind"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "$base/$asset"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/checksums.txt" "$base/basemind_${version}_checksums.txt"
          # macOS ships `shasum`, not `sha256sum`; both verify the same manifest.
          if command -v sha256sum >/dev/null 2>&1; then
            digest='sha256sum -c -'
          else
            digest='shasum -a 256 -c -'
          fi
          if ! (cd "$RUNNER_TEMP" && grep " $asset\$" checksums.txt | $digest); then
            echo "::error::the BaseMind $version asset did not match its published checksum"
            exit 1
          fi
          case "$asset" in
            *.zip) unzip -q "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/basemind" ;;
            *) tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/basemind" ;;
          esac
          bin="$(find "$RUNNER_TEMP/basemind" -maxdepth 2 -type f -name '${{ matrix.binary }}' | head -n1)"
          if [ -z "$bin" ]; then
            echo "::error::the BaseMind archive did not contain ${{ matrix.binary }}"
            exit 1
          fi
          chmod +x "$bin"
          # The macOS asset is arm64 only, so a mislabelled x64 runner must fail with a
          # legible message instead of an exec format error.
          machine="$(uname -m)"
          if [ "$machine" != '${{ matrix.arch }}' ]; then
            echo "::error::this runner is $machine but $asset needs ${{ matrix.arch }}"
            exit 1
          fi
          "$bin" --version
          echo "BASEMIND_BIN=$bin" >> "$GITHUB_ENV"

      - name: Run the pinned verb-tool contract suite
        if: env.BM_VERSION == env.BM_PIN
        env:
          BASEMIND_REQUIRE_INTEGRATION: '1'
        run: node --test test/integration.test.mjs

      - name: Run the version-agnostic suite
        env:
          BASEMIND_REQUIRE_INTEGRATION: '1'
        run: node --test test/integration-legacy.test.mjs
