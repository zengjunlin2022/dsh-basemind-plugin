name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: node --test

      - name: Syntax check
        shell: bash
        run: |
          node --check index.js
          for file in lib/*.js; do node --check "$file"; done

      - name: Check the bundle manifest
        run: node scripts/check-manifest.mjs

      - name: Check the packed contents
        shell: bash
        run: |
          npm pack --json --dry-run > pack.json
          node scripts/check-pack.mjs pack.json
