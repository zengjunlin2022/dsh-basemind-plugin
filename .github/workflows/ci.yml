name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24.20.0
          - os: windows-latest
            node: 24.20.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        # `npm test` stays the single source of truth for how the suite runs; the extra
        # reporters only add a plain-text summary, so a red run can be diagnosed from a
        # downloaded artifact even when the job log is unavailable.
        shell: bash
        run: |
          mkdir -p _ci
          npm test -- \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=spec --test-reporter-destination=_ci/test-summary.txt

      - name: Upload the failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary-${{ matrix.os }}
          path: _ci/test-summary.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Check the bundle
        run: npm run check

      - name: Check the vendored skills against their provenance
        run: npm run check:skills

      - name: Check the packed contents
        run: npm run check:pack
